name: Deploy Chanchan Quiz
on:
  push:
    branches: [main]
    paths:
      - chanchan-hosting-package.zip
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website package
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extract and validate website
        run: |
          unzip -q chanchan-hosting-package.zip -d _site
          test -s _site/public/index.html
          test -s _site/public/app.js
          test "$(find _site/public/assets -name '*.webp' | wc -l)" -eq 592
          touch _site/public/.nojekyll
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
